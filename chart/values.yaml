replicaCount: 1

image:
  repository: ghcr.io/thegostsniperfr/offhours-guard
  pullPolicy: Always
  tag: "latest"

# Verifies the access token the Gateway's OIDC filter forwards. Empty issuer
# keeps the dashboard and the sleep/wake routes closed (503); /health stays
# open for Gatus. "{project}" is replaced by the project detected from the
# release namespace's "project" label.
auth:
  issuer: ""
  # Defaults to Keycloak's <issuer>/protocol/openid-connect/certs.
  jwksURL: ""
  allowedGroups:
    - project-members
    - project-admins

service:
  type: ClusterIP
  port: 8082
  metricsPort: 8083

resources:
  limits:
    cpu: 100m
    memory: 32Mi
  requests:
    cpu: 50m
    memory: 32Mi

# Pod Security Standard "restricted".
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]