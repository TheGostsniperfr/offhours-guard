replicaCount: 1

image:
  repository: ghcr.io/thegostsniperfr/offhours-guard
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8082
  metricsPort: 8083

resources:
  limits:
    cpu: 100m
    memory: 32Mi
  requests:
    cpu: 50m
    memory: 32Mi

# Pod Security Standard "restricted".
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]